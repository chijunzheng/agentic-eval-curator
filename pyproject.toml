[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-eval-curator"
version = "0.1.0"
description = "Universal benchmark curation system for evaluating agentic RAG improvements via MCQ datasets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jason Chi"}
]
keywords = ["rag", "benchmark", "evaluation", "llm", "agentic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click==8.1.7",
    "google-generativeai==0.8.3",
    "pydantic==2.10.3",
    "pdfplumber==0.11.4",
    "beautifulsoup4==4.12.3",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.3",
]
unstructured = [
    "unstructured[all-docs]>=0.16.0",
]

[project.scripts]
rag-bench = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
