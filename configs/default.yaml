# Default pipeline configuration for agentic-eval-curator

data_dir: data

chunking:
  # Options: fixed_window, semantic, table_aware, semantic_table_aware, sentence_aware, sentence_table_aware
  # sentence_table_aware is best for PDFs with technical prose and tables
  strategy: sentence_table_aware
  # ~500 tokens (1 token ≈ 4 chars for English)
  chunk_size: 2000
  # ~100 tokens overlap
  chunk_overlap: 400

generation:
  model: gemini-2.5-flash
  temperature: 0.7
  max_output_tokens: 4096
  items_per_chunk_group: 3

frozen:
  distractor_count: 10
  distractor_strategy: random

# Set for reproducible runs (optional)
# seed: 42
